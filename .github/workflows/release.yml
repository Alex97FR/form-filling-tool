name: Build and publish release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact commit
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate version and extension
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ ${#GITHUB_REF_NAME} -le 100 ]]
            node -e 'const manifest = require("./manifest.json"); if (process.env.GITHUB_REF_NAME !== `v${manifest.version}`) process.exit(1);'
          fi
          git --version
          node --version
          gh --version
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          for script in background.js content.js dashboard.js options.js tests/*.test.js; do
            node --check "$script"
          done
          node tests/address-matching.test.js
          node tests/security.test.js

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact tagged commit
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build release ZIP
        run: git archive --format=zip --output="Form-filling-tool-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Form-filling-tool-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
              gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
